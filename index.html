@keyframes entR{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes sai{to{opacity:0;transform:translateX(-8px)}}
.top{height:52px;flex:none;display:flex;align-items:center;gap:8px;padding:0 8px 0 4px;background:var(--ab1);border-bottom:1px solid var(--abd);z-index:5}

.ib:hover,.ib:active{background:var(--aaS)}

.dica{margin:0;font-size:12.5px;color:var(--atx2)}
.mon-alca,.mon-canto44{display:grid;place-items:center}.mon-canto44 b{width:26px;height:26px}.mon-alca i{display:block;width:20px;height:20px;border-radius:50%;background:#fff;border:4px solid #d9b46a;box-shadow:0 1px 6px rgba(0,0,0,.35)}
.mon-alca.r0 i,.mon-alca.ini i{border-color:#2f8f5b}.mon-alca.r1 i,.mon-alca.fim i{border-color:#c0583c}
/* v0.4.0 · aviso da visita em aberto no mapa geral (guardar e continuar depois) */
.mon-ab{left:8px;top:60px;width:min(340px,calc(100% - 16px));display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;background:var(--ab1);border-radius:var(--rs);box-shadow:0 2px 8px rgba(20,15,5,.14);opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .25s var(--eo),transform .25s var(--eo)}
.mon-ab.on{opacity:1;transform:none;pointer-events:auto}
.mon-ab-t{flex:1;min-width:0;display:flex;flex-direction:column}.mon-ab-t b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mon-ab-t small{font-size:12.5px;color:var(--atx2)}
.mon-ab .btn.sm{height:44px;flex:none}
.sh-f .lin+.lin{margin-top:8px}
.caixa .row small.er{color:var(--acr)}
.leg .tag{color:var(--atx2)}
/* v0.4.1 · quadros do mapa (Leaflet) e zoom dentro da regra de durações */
.leaflet-fade-anim .leaflet-tile{transition:opacity .25s linear}
/* v0.5.0 · ponto no estilo Cropwise: indicadores agrupados por praga */
.pr-g{border-bottom:1px solid var(--abd);padding:6px 0 4px}.pr-g:last-child{border-bottom:0}
.pr-gn{display:block;font-size:15px;padding-top:4px}
.pr-g .pr-l{border-bottom:0;padding:6px 0}.pr-in{font-size:14px;display:block}
.step .stp-n{flex:1;min-width:0;width:44px;height:44px;border:0;background:none;text-align:center;font:600 18px var(--f);color:var(--atx);font-variant-numeric:tabular-nums;padding:0}
.step .stp-n:focus{outline:2px solid var(--aa);outline-offset:-2px}
.seg2{display:flex;width:134px;border:1px solid var(--abd);border-radius:var(--rs);overflow:hidden;flex:none}
.seg2 button{flex:1;height:44px;border:0;background:var(--ab1);font:600 15px var(--f);color:var(--atx2);transition:background-color .15s,color .15s}
.seg2 button.on{background:var(--aaS);color:var(--aaTx)}
.rv-p{border-bottom:1px solid var(--abd);padding:8px 0}.rv-p>b{font-size:15px}.rv-p>small{display:block;color:var(--atx3);font-size:12.5px}
.rv-i{padding:6px 0 2px}.rv-l{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.rv-l>span:first-child{flex:1 1 100%;font-size:14px;color:var(--atx2)}.rv-l>b{font-size:15px;font-variant-numeric:tabular-nums}
.hist{display:flex;align-items:flex-end;gap:4px;margin-top:6px;height:76px}.hist div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:0;font-size:11.5px;color:var(--atx3)}
.hist i{display:block;width:100%;max-width:28px;background:var(--aa);opacity:.55;border-radius:3px 3px 0 0}.hist b{font-weight:600;color:var(--atx2)}
.rv-nao{padding:10px 0;font-size:14px;color:var(--atx2)}.rv-nao b{display:block;color:var(--atx3);font-size:12.5px}

/* v0.6.0 · ITEM 251: no PC não aparece o Monitorar (a visita é no celular, dentro da área) */
.pc [data-act=mon],.pc [data-act=monit],.pc [data-act=retomaAb]{display:none!important}
